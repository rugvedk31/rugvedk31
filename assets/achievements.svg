<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif">
<defs><linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<style>.c{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .7s cubic-bezier(.34,1.56,.64,1) forwards}@keyframes pop{0%{opacity:0;transform:scale(.6) translateY(20px)}100%{opacity:1;transform:scale(1) translateY(0)}}.i{transform-box:fill-box;transform-origin:center;animation:bob 2.4s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}</style>
<clipPath id="cp0"><rect x="15" y="20" width="280" height="110" rx="14"/></clipPath>
<clipPath id="cp1"><rect x="310" y="20" width="280" height="110" rx="14"/></clipPath>
<clipPath id="cp2"><rect x="605" y="20" width="280" height="110" rx="14"/></clipPath>
</defs>
<g class="c" style="animation-delay:0.3s">
<rect x="15" y="20" width="280" height="110" rx="14" fill="#1a1b26" stroke="#e0af68" stroke-width="2"/>
<circle cx="65" cy="75" r="30" fill="#e0af68" fill-opacity=".14" stroke="#e0af68" stroke-opacity=".6"/>
<text class="i" style="animation-delay:0.0s" x="65" y="85" text-anchor="middle" font-size="28">💻</text>
<text x="110" y="52" font-size="9.5" font-weight="700" letter-spacing="1" fill="#e0af68">🏆 ACHIEVEMENT UNLOCKED</text>
<text x="110" y="82" font-size="21" font-weight="800" fill="#c0caf5">400+ LeetCode</text>
<text x="110" y="104" font-size="12" fill="#787c99">problems solved &amp; counting</text>
<g clip-path="url(#cp0)"><rect x="-105" y="20" width="100" height="110" fill="url(#sh)"><animate attributeName="x" from="-105" to="315" dur="2.8s" begin="1.5s" repeatCount="indefinite"/></rect></g>
</g>
<g class="c" style="animation-delay:0.6499999999999999s">
<rect x="310" y="20" width="280" height="110" rx="14" fill="#1a1b26" stroke="#f7768e" stroke-width="2"/>
<circle cx="360" cy="75" r="30" fill="#f7768e" fill-opacity=".14" stroke="#f7768e" stroke-opacity=".6"/>
<text class="i" style="animation-delay:0.5s" x="360" y="85" text-anchor="middle" font-size="28">📄</text>
<text x="405" y="52" font-size="9.5" font-weight="700" letter-spacing="1" fill="#f7768e">🏆 ACHIEVEMENT UNLOCKED</text>
<text x="405" y="82" font-size="21" font-weight="800" fill="#c0caf5">Patent Filed</text>
<text x="405" y="104" font-size="12" fill="#787c99">RoomBuddy · PG booking system</text>
<g clip-path="url(#cp1)"><rect x="190" y="20" width="100" height="110" fill="url(#sh)"><animate attributeName="x" from="190" to="610" dur="2.8s" begin="2.1s" repeatCount="indefinite"/></rect></g>
</g>
<g class="c" style="animation-delay:1.0s">
<rect x="605" y="20" width="280" height="110" rx="14" fill="#1a1b26" stroke="#7dcfff" stroke-width="2"/>
<circle cx="655" cy="75" r="30" fill="#7dcfff" fill-opacity=".14" stroke="#7dcfff" stroke-opacity=".6"/>
<text class="i" style="animation-delay:1.0s" x="655" y="85" text-anchor="middle" font-size="28">⚡</text>
<text x="700" y="52" font-size="9.5" font-weight="700" letter-spacing="1" fill="#7dcfff">🏆 ACHIEVEMENT UNLOCKED</text>
<text x="700" y="82" font-size="21" font-weight="800" fill="#c0caf5">AI/ML Intern</text>
<text x="700" y="104" font-size="12" fill="#787c99">building agents @ Emerson</text>
<g clip-path="url(#cp2)"><rect x="485" y="20" width="100" height="110" fill="url(#sh)"><animate attributeName="x" from="485" to="905" dur="2.8s" begin="2.7s" repeatCount="indefinite"/></rect></g>
</g>
</svg>