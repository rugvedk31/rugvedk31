<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="15">
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7aa2f7"/>
      <stop offset="50%" stop-color="#bb9af7"/>
      <stop offset="100%" stop-color="#7dcfff"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="c1"><rect x="140" y="56" height="22" width="0"><animate attributeName="width" from="0" to="70" begin="0.5s" dur="0.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="140" y="116" height="22" width="0"><animate attributeName="width" from="0" to="130" begin="2.0s" dur="0.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="c5"><rect x="140" y="176" height="22" width="0"><animate attributeName="width" from="0" to="160" begin="3.8s" dur="1.0s" fill="freeze"/></rect></clipPath>
    <clipPath id="c7"><rect x="140" y="236" height="22" width="0"><animate attributeName="width" from="0" to="110" begin="5.7s" dur="0.8s" fill="freeze"/></rect></clipPath>
  </defs>

  <!-- window -->
  <rect x="6" y="6" width="808" height="348" rx="14" fill="#1a1b26" stroke="url(#border)" stroke-width="2" filter="url(#glow)"/>
  <rect x="6" y="6" width="808" height="348" rx="14" fill="#1a1b26"/>
  <rect x="6" y="6" width="808" height="348" rx="14" fill="none" stroke="url(#border)" stroke-width="2"/>
  <path d="M6 20 a14 14 0 0 1 14 -14 H800 a14 14 0 0 1 14 14 V40 H6 Z" fill="#16161e"/>
  <circle cx="30" cy="23" r="6" fill="#f7768e"/>
  <circle cx="50" cy="23" r="6" fill="#e0af68"/>
  <circle cx="70" cy="23" r="6" fill="#9ece6a"/>
  <text x="410" y="28" text-anchor="middle" fill="#565f89" font-size="13">rugved@pune — zsh — 80×24</text>

  <!-- line 1 -->
  <g opacity="0"><animate attributeName="opacity" to="1" begin="0.2s" dur="0.2s" fill="freeze"/>
    <text x="24" y="72"><tspan fill="#9ece6a">rugved@pune</tspan><tspan fill="#c0caf5">:</tspan><tspan fill="#7aa2f7">~</tspan><tspan fill="#c0caf5">$</tspan></text>
  </g>
  <text x="140" y="72" fill="#c0caf5" clip-path="url(#c1)">whoami</text>
  <g opacity="0"><animate attributeName="opacity" to="1" begin="1.3s" dur="0.3s" fill="freeze"/>
    <text x="24" y="102" fill="#bb9af7">➜ <tspan fill="#c0caf5">Rugved Kumbhar</tspan><tspan fill="#565f89"> · </tspan><tspan fill="#7dcfff">AI/ML Intern @ Emerson</tspan><tspan fill="#565f89"> · </tspan><tspan fill="#ff9e64">Final-year CS</tspan></text>
  </g>

  <!-- line 3 -->
  <g opacity="0"><animate attributeName="opacity" to="1" begin="1.8s" dur="0.2s" fill="freeze"/>
    <text x="24" y="132"><tspan fill="#9ece6a">rugved@pune</tspan><tspan fill="#c0caf5">:</tspan><tspan fill="#7aa2f7">~</tspan><tspan fill="#c0caf5">$</tspan></text>
  </g>
  <text x="140" y="132" fill="#c0caf5" clip-path="url(#c3)">cat focus.txt</text>
  <g opacity="0"><animate attributeName="opacity" to="1" begin="3.1s" dur="0.3s" fill="freeze"/>
    <text x="24" y="162" fill="#bb9af7">➜ <tspan fill="#7aa2f7">Agentic AI</tspan><tspan fill="#565f89"> · </tspan><tspan fill="#7dcfff">LangGraph</tspan><tspan fill="#565f89"> · </tspan><tspan fill="#9ece6a">Advanced RAG</tspan><tspan fill="#565f89"> · </tspan><tspan fill="#e0af68">LLMOps</tspan><tspan fill="#565f89"> · </tspan><tspan fill="#ff9e64">AWS/Azure</tspan></text>
  </g>

  <!-- line 5 -->
  <g opacity="0"><animate attributeName="opacity" to="1" begin="3.6s" dur="0.2s" fill="freeze"/>
    <text x="24" y="192"><tspan fill="#9ece6a">rugved@pune</tspan><tspan fill="#c0caf5">:</tspan><tspan fill="#7aa2f7">~</tspan><tspan fill="#c0caf5">$</tspan></text>
  </g>
  <text x="140" y="192" fill="#c0caf5" clip-path="url(#c5)">ls achievements/</text>
  <g opacity="0"><animate attributeName="opacity" to="1" begin="5.0s" dur="0.3s" fill="freeze"/>
    <text x="24" y="222"><tspan fill="#e0af68">leetcode_400+/</tspan><tspan>    </tspan><tspan fill="#f7768e" dx="24">patent_roombuddy.pdf</tspan><tspan dx="24" fill="#9ece6a">agroassist_fyp/</tspan></text>
  </g>

  <!-- line 7 -->
  <g opacity="0"><animate attributeName="opacity" to="1" begin="5.5s" dur="0.2s" fill="freeze"/>
    <text x="24" y="252"><tspan fill="#9ece6a">rugved@pune</tspan><tspan fill="#c0caf5">:</tspan><tspan fill="#7aa2f7">~</tspan><tspan fill="#c0caf5">$</tspan></text>
  </g>
  <text x="140" y="252" fill="#c0caf5" clip-path="url(#c7)">echo $MOTTO</text>
  <g opacity="0"><animate attributeName="opacity" to="1" begin="6.7s" dur="0.4s" fill="freeze"/>
    <text x="24" y="282" fill="#7dcfff" font-style="italic">"The best AI is the kind that actually ships to production." 🚀</text>
  </g>

  <!-- final prompt + blinking cursor -->
  <g opacity="0"><animate attributeName="opacity" to="1" begin="7.4s" dur="0.2s" fill="freeze"/>
    <text x="24" y="318"><tspan fill="#9ece6a">rugved@pune</tspan><tspan fill="#c0caf5">:</tspan><tspan fill="#7aa2f7">~</tspan><tspan fill="#c0caf5">$</tspan></text>
    <rect x="140" y="304" width="9" height="18" fill="#c0caf5">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
