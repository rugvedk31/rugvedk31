<svg xmlns="http://www.w3.org/2000/svg" width="920" height="230" viewBox="0 0 920 230" font-family="'Segoe UI','Inter',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1a12"/>
      <stop offset="100%" stop-color="#1a1b26"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9ece6a"/>
      <stop offset="100%" stop-color="#7dcfff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .flow { stroke-dasharray: 6 8; animation: dash 1s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -14; } }
      .title { animation: breathe 3s ease-in-out infinite; }
      @keyframes breathe { 0%,100% { opacity: .75 } 50% { opacity: 1 } }
    </style>
  </defs>

  <rect x="2" y="2" width="916" height="226" rx="16" fill="url(#bg)" stroke="#2a3a2a" stroke-width="2"/>
  <text class="title" x="460" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#9ece6a" letter-spacing="2">🌾 AGROASSIST · AI INFERENCE PIPELINE</text>

  <!-- connection line -->
  <path d="M85 112 H835" stroke="#3b4261" stroke-width="2"/>
  <path class="flow" d="M85 112 H835" stroke="url(#hot)" stroke-width="2" fill="none"/>

  <!-- data packet + trail -->
  <g filter="url(#glow)">
    <circle r="7" fill="#9ece6a"><animateMotion path="M85 112 H835" dur="4.8s" repeatCount="indefinite"/></circle>
    <circle r="4" fill="#9ece6a" opacity=".5"><animateMotion path="M85 112 H835" dur="4.8s" begin="0.08s" repeatCount="indefinite"/></circle>
    <circle r="2.5" fill="#9ece6a" opacity=".3"><animateMotion path="M85 112 H835" dur="4.8s" begin="0.16s" repeatCount="indefinite"/></circle>
  </g>

  <!-- nodes: glow when the packet arrives (150px per 0.96s) -->
  <g font-size="14" font-weight="700" text-anchor="middle">
    <g>
      <rect x="20" y="77" width="130" height="70" rx="12" fill="#16161e" stroke="#7aa2f7" stroke-width="1.5">
        <animate attributeName="stroke-width" values="4;1.5;1.5" keyTimes="0;0.15;1" dur="4.8s" begin="0s" repeatCount="indefinite"/>
      </rect>
      <text x="85" y="108" fill="#7aa2f7">React Native</text>
      <text x="85" y="128" fill="#565f89" font-size="11" font-weight="400">📱 farmer snaps leaf</text>
    </g>
    <g>
      <rect x="170" y="77" width="130" height="70" rx="12" fill="#16161e" stroke="#7dcfff" stroke-width="1.5">
        <animate attributeName="stroke-width" values="4;1.5;1.5" keyTimes="0;0.15;1" dur="4.8s" begin="0.96s" repeatCount="indefinite"/>
      </rect>
      <text x="235" y="108" fill="#7dcfff">FastAPI</text>
      <text x="235" y="128" fill="#565f89" font-size="11" font-weight="400">⚡ async backend</text>
    </g>
    <g>
      <rect x="320" y="72" width="130" height="80" rx="12" fill="#1f1d2e" stroke="#bb9af7" stroke-width="2">
        <animate attributeName="stroke-width" values="5;2;2" keyTimes="0;0.15;1" dur="4.8s" begin="1.92s" repeatCount="indefinite"/>
      </rect>
      <text x="385" y="106" fill="#bb9af7">LangGraph</text>
      <text x="385" y="124" fill="#565f89" font-size="11" font-weight="400">🧠 agent orchestrator</text>
      <text x="385" y="140" fill="#bb9af7" font-size="9" font-weight="400" opacity=".8">state · routing · tools</text>
    </g>
    <g>
      <rect x="470" y="77" width="130" height="70" rx="12" fill="#16161e" stroke="#f7768e" stroke-width="1.5">
        <animate attributeName="stroke-width" values="4;1.5;1.5" keyTimes="0;0.15;1" dur="4.8s" begin="2.88s" repeatCount="indefinite"/>
      </rect>
      <text x="535" y="108" fill="#f7768e">DenseNet201</text>
      <text x="535" y="128" fill="#565f89" font-size="11" font-weight="400">🔬 disease detection</text>
    </g>
    <g>
      <rect x="620" y="77" width="130" height="70" rx="12" fill="#16161e" stroke="#ff9e64" stroke-width="1.5">
        <animate attributeName="stroke-width" values="4;1.5;1.5" keyTimes="0;0.15;1" dur="4.8s" begin="3.84s" repeatCount="indefinite"/>
      </rect>
      <text x="685" y="108" fill="#ff9e64">Groq LLM</text>
      <text x="685" y="128" fill="#565f89" font-size="11" font-weight="400">💬 crop advisory</text>
    </g>
    <g>
      <rect x="770" y="77" width="130" height="70" rx="12" fill="#16161e" stroke="#9ece6a" stroke-width="1.5">
        <animate attributeName="stroke-width" values="1.5;1.5;4;1.5" keyTimes="0;0.84;0.99;1" dur="4.8s" begin="0s" repeatCount="indefinite"/>
      </rect>
      <text x="835" y="108" fill="#9ece6a">MongoDB + S3</text>
      <text x="835" y="128" fill="#565f89" font-size="11" font-weight="400">🗄️ Atlas · images</text>
    </g>
  </g>

  <text x="460" y="198" text-anchor="middle" font-size="12" fill="#565f89">image ➜ diagnosis ➜ actionable advice — end-to-end, in production-style architecture</text>
</svg>
